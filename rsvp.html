<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff9ef">
  <title>RSVP | Bharath & Harishmitha</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="shell">
    <header>
      <div class="monogram">B ♡ H</div>
      <div class="leaves">✦ Together Forever ✦</div>

      <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="venue.html">Venue</a>
        <a class="active" href="rsvp.html">RSVP</a>
        <a href="guest.html">Guest</a>
      </nav>
    </header>

    <div class="divider">❀ ✦ ❀</div>

    <h1>Kindly RSVP</h1>

    <p class="quote">
      We would love to celebrate our special day with you.
      Please confirm your presence.
    </p>

    <section class="frame">
      <form id="rsvpForm">

        <label class="field" for="guestName">
          Your Name
          <input
            type="text"
            id="guestName"
            name="name"
            placeholder="Enter your full name"
            maxlength="120"
            required
          >
        </label>

        <label class="field" for="guestCount">
          Number of Guests (Including You)
          <input
            type="number"
            id="guestCount"
            name="guests"
            min="1"
            max="50"
            value="1"
            required
          >
        </label>

        <h3>Events You Will Attend</h3>

        <label class="choice">
          <input
            type="checkbox"
            name="events"
            value="Sangeeth"
          >
          Sangeeth — December 25
        </label>

        <label class="choice">
          <input
            type="checkbox"
            name="events"
            value="Haldi"
          >
          Haldi — December 26
        </label>

        <label class="choice">
          <input
            type="checkbox"
            name="events"
            value="Wedding"
          >
          Wedding — December 27
        </label>

        <h3>Meal Preference</h3>

        <p class="center">
          You may select both options if your group
          includes different preferences.
        </p>

        <label class="choice">
          <input
            type="checkbox"
            name="meal_preference"
            value="Vegetarian"
          >
          Vegetarian
        </label>

        <label class="choice">
          <input
            type="checkbox"
            name="meal_preference"
            value="Non-Vegetarian"
          >
          Non-Vegetarian
        </label>

        <input
          type="hidden"
          name="_subject"
          value="New Bharath & Harishmitha Wedding RSVP"
        >

        <button
          type="submit"
          id="submitRSVP"
          class="button"
        >
          Submit RSVP
        </button>

        <p
          id="rsvpStatus"
          class="status"
          role="status"
          aria-live="polite"
        ></p>

      </form>
    </section>

    <div class="foot" aria-hidden="true"></div>
  </main>

  <audio id="weddingMusic" loop preload="none"></audio>
  <button id="musicToggle" class="muter" type="button"
          aria-label="Play wedding music">♫</button>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
