
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff9ef">

  <title>RSVP | Bharath & Harishmitha Wedding</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="shell">

    <header>
      <div class="monogram">B ♡ H</div>
      <div class="leaves">✦ Together Forever ✦</div>

      <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="venue.html">Venue</a>
        <a class="active" href="rsvp.html">RSVP</a>
        <a href="guest.html">Guest</a>
      </nav>
    </header>

    <div class="divider">❀ ✦ ❀</div>

    <h1>Kindly RSVP</h1>

    <p class="quote">
      We would love to celebrate our special day with you.
      Please confirm your presence.
    </p>

    <section class="frame">

      <form
        id="rsvpForm"
        action="https://formspree.io/f/xrpqkrwa"
        method="POST"
      >

        <label class="field" for="guestName">
          Your Name

          <input
            type="text"
            id="guestName"
            name="name"
            placeholder="Enter your full name"
            maxlength="120"
            required
          >
        </label>

        <label class="field" for="guestCount">
          Number of Guests (Including You)

          <input
            type="number"
            id="guestCount"
            name="guests"
            min="1"
            max="50"
            value="1"
            required
          >
        </label>

        <h3>Events You Will Attend</h3>

        <label class="choice">
          <input
            type="checkbox"
            name="events"
            value="Sangeeth"
          >
          Sangeeth — December 25
        </label>

        <label class="choice">
          <input
            type="checkbox"
            name="events"
            value="Haldi"
          >
          Haldi — December 26
        </label>

        <label class="choice">
          <input
            type="checkbox"
            name="events"
            value="Wedding"
          >
          Wedding — December 27
        </label>

        <h3>Meal Preference</h3>

        <p class="center">
          Select both if your group includes
          different meal preferences.
        </p>

        <label class="choice">
          <input
            type="checkbox"
            name="meal_preference"
            value="Vegetarian"
          >
          Vegetarian
        </label>

        <label class="choice">
          <input
            type="checkbox"
            name="meal_preference"
            value="Non-Vegetarian"
          >
          Non-Vegetarian
        </label>

        <input
          type="hidden"
          name="_subject"
          value="New Bharath & Harishmitha Wedding RSVP"
        >

        <button
          type="submit"
          id="submitRSVP"
          class="button"
        >
          Submit RSVP
        </button>

        <p
          id="rsvpStatus"
          class="status"
          role="status"
          aria-live="polite"
        ></p>

      </form>

    </section>

    <div class="foot"></div>

  </main>

  <!-- WEDDING MUSIC -->

  <audio
    id="weddingMusic"
    src="assets/music.mp3"
    loop
    preload="auto"
  ></audio>

  <button
    id="musicToggle"
    class="muter"
    type="button"
    aria-label="Mute wedding music"
  >
    🔊
  </button>

  <script>

    // =====================================
    // MUSIC AUTOPLAY + MUTE / UNMUTE
    // =====================================

    const music = document.getElementById("weddingMusic");
    const musicButton = document.getElementById("musicToggle");

    music.volume = 0.65;

    music.muted =
      sessionStorage.getItem("musicMuted") === "true";

    function updateMusicButton() {

      musicButton.textContent =
        music.muted ? "🔇" : "🔊";

      musicButton.setAttribute(
        "aria-label",
        music.muted
          ? "Unmute wedding music"
          : "Mute wedding music"
      );

    }

    function playMusic() {

      music.play().catch(() => {
        // Browser may block autoplay until user interaction.
      });

    }

    music.addEventListener("loadedmetadata", () => {

      const saved = Number(
        sessionStorage.getItem("musicTime") || 0
      );

      if (
        Number.isFinite(saved) &&
        saved > 0 &&
        Number.isFinite(music.duration)
      ) {

        music.currentTime = Math.min(
          saved,
          Math.max(0, music.duration - 0.1)
        );

      }

    });

    music.addEventListener("timeupdate", () => {

      sessionStorage.setItem(
        "musicTime",
        String(music.currentTime)
      );

    });

    window.addEventListener("pagehide", () => {

      sessionStorage.setItem(
        "musicTime",
        String(music.currentTime)
      );

    });

    musicButton.addEventListener("click", () => {

      music.muted = !music.muted;

      sessionStorage.setItem(
        "musicMuted",
        String(music.muted)
      );

      updateMusicButton();

      playMusic();

    });

    document.addEventListener(
      "pointerdown",
      playMusic,
      { once: true }
    );

    document.addEventListener(
      "keydown",
      playMusic,
      { once: true }
    );

    updateMusicButton();
    playMusic();


    // =====================================
    // RSVP FORM SUBMISSION
    // =====================================

    const form = document.getElementById("rsvpForm");

    const submitButton =
      document.getElementById("submitRSVP");

    const status =
      document.getElementById("rsvpStatus");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      // Selected events

      const selectedEvents = Array.from(
        form.querySelectorAll(
          'input[name="events"]:checked'
        )
      ).map(input => input.value);

      // Selected meal preferences

      const selectedMeals = Array.from(
        form.querySelectorAll(
          'input[name="meal_preference"]:checked'
        )
      ).map(input => input.value);

      if (selectedEvents.length === 0) {

        status.textContent =
          "Please select at least one event.";

        status.className = "status error";

        return;

      }

      if (selectedMeals.length === 0) {

        status.textContent =
          "Please select your meal preference.";

        status.className = "status error";

        return;

      }

      const name = document
        .getElementById("guestName")
        .value.trim();

      const guests = Number(
        document.getElementById("guestCount").value
      );

      if (
        !name ||
        !Number.isInteger(guests) ||
        guests < 1 ||
        guests > 50
      ) {

        status.textContent =
          "Please enter a valid name and guest count.";

        status.className = "status error";

        return;

      }

      // Prepare Formspree submission

      const formData = new FormData();

      formData.append("name", name);

      formData.append(
        "guests",
        String(guests)
      );

      formData.append(
        "events",
        selectedEvents.join(", ")
      );

      formData.append(
        "meal_preference",
        selectedMeals.join(", ")
      );

      formData.append(
        "_subject",
        "New Bharath & Harishmitha Wedding RSVP"
      );

      submitButton.disabled = true;

      submitButton.textContent =
        "Submitting...";

      status.textContent =
        "Sending your RSVP...";

      status.className = "status";

      try {

        const response = await fetch(form.action, {

          method: "POST",

          body: formData,

          headers: {
            Accept: "application/json"
          }

        });

        if (!response.ok) {

          throw new Error(
            "Formspree submission failed"
          );

        }

        // Save guest name for welcome message
        sessionStorage.setItem(
          "weddingGuestName",
          name
        );

        sessionStorage.setItem(
          "weddingRSVPSuccess",
          "true"
        );

        // Redirect to Guest page after success
        window.location.href = "guest.html";

      } catch (error) {

        console.error("RSVP error:", error);

        status.textContent =
          "Sorry, your RSVP could not be submitted. Please try again.";

        status.className = "status error";

        submitButton.disabled = false;

        submitButton.textContent =
          "Submit RSVP";

      }

    });

  </script>

</body>
</html>
